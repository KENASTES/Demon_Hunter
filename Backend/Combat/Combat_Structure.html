<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combat System</title>
    <link rel="stylesheet" href="Combat_Decoration.css">
</head>

<body>
    <div class="combat-wrapper">

        <!-- โซนด้านบน: แถบสถานะ (HUD) -->
        <div class="hud-container">

            <!-- ซ้ายบน: ฝั่งผู้เล่น -->
            <div class="hud-panel player-hud">
                <h2 class="char-name">Hunter <span class="level-badge" id="player-level-text">Lv.1</span></h2>
                <div class="hp-bar-bg">
                    <div class="hp-bar player-hp" id="player-hp-bar"></div>
                </div>
                <p class="hp-text" id="player-hp-text">100 / 100</p>
                <div class="stats-row">
                    <span>ATK: <b id="player-atk">0</b></span>
                    <span>DEF: <b id="player-def">0</b></span>
                    <span>MAG: <b id="player-mag">0</b></span>
                </div>
            </div>

            <!-- ขวาบน: ฝั่งศัตรู -->
            <div class="hud-panel enemy-hud">
                <h2 class="char-name">Goblin <span class="level-badge" id="enemy-level-text">Lv.1</span></h2>
                <div class="hp-bar-bg">
                    <div class="hp-bar enemy-hp" id="enemy-hp-bar"></div>
                </div>
                <p class="hp-text" id="enemy-hp-text">80 / 80</p>
                <div class="stats-row">
                    <span>ATK: <b id="enemy-atk">0</b></span>
                    <span>DEF: <b id="enemy-def">0</b></span>
                    <span>MAG: <b id="enemy-mag">0</b></span>
                </div>
            </div>

        </div>

        <!-- โซนตรงกลาง: พื้นที่ว่างสำหรับแสดงกราฟิก/Pixel Art ในอนาคต -->


        <div class="battle-stage">
            <div class="battle-stage">
            <!-- ซ้าย: ฝั่งผู้เล่น (เลือกสาย Flex ท่ายืนรอ) -->
            <div class="sprite-canvas char-flex act-idle" id="player-sprite"></div>
            
            <!-- หน้าต่าง Level Up (คงโค้ดเดิมไว้) ... -->
            
            <!-- ขวา: ฝั่งศัตรู (สมมติให้ศัตรูเป็นสาย Torque) -->
            <div class="sprite-canvas enemy-sprite char-torque act-idle" id="enemy-sprite"></div>
        </div>
            <!-- หน้าต่าง Level Up (ซ่อนไว้เป็นค่าเริ่มต้น) -->
            <div id="level-up-modal" class="level-up-modal" style="display: none;">
                <h2>LEVEL UP!</h2>
                <p>Level: <span id="current-level">1</span></p>
                <p>Points: <span id="stat-points" style="color: #ffeb3b; font-weight: bold; font-size: 20px;">0</span>
                </p>

                <div class="stat-alloc-buttons">
                    <button onclick="allocateStat('atk')">ATK +1</button>
                    <button onclick="allocateStat('def')">DEF +1</button>
                    <button onclick="allocateStat('mag')">MAG +1</button>
                </div>
                <button onclick="closeLevelUpModal()" id="btn-close-modal" style="margin-top: 15px; width: 100%;"
                    disabled>Confirm</button>
            </div>
        </div>

        <!-- โซนด้านล่าง: กล่องข้อความและปุ่มกด -->
        <div class="control-container">
            <div class="battle-log">
                <h3>Battle Log</h3>
                <p id="log-text">Wild Goblin appeared! Your turn.</p>
                <p id="enemy-action-text" class="enemy-action">-</p>
                <button onclick="forceLevelUp()" class="btn-dev">Force Lv.UP</button>
            </div>

            <div class="action-buttons">
                <button onclick="handlePlayerAction('ATTACK')" id="btn-attack" class="btn-atk">Attack</button>
                <button onclick="handlePlayerAction('STRIKE')" id="btn-strike" class="btn-str">Strike</button>
                <button onclick="handlePlayerAction('MAGIC')" id="btn-magic" class="btn-mag">Magic</button>
            </div>
        </div>

    </div>

    <script src="Combat_Logic.js"></script>
</body>

</html>
