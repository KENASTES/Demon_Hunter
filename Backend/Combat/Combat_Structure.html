<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combat System</title>
    <link rel="stylesheet" href="Combat_Decoration.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
</head>

<body>
    <div class="combat-wrapper">
        <header class="hud-container">
            <div class="hud-panel player-hud">
                <h2 class="char-name">Hunter <span class="level-badge" id="player-level-text">Lv.1</span></h2>
                <div class="hp-bar-bg">
                    <div class="hp-bar player-hp" id="player-hp-bar"></div>
                </div>
                <p class="hp-text" id="player-hp-text">100 / 100</p>
                <div class="stats-row">
                    <span>ATK: <b id="player-atk">20</b></span>
                    <span>DEF: <b id="player-def">15</b></span>
                    <span>MAG: <b id="player-mag">25</b></span>
                    <span>FORM: <b id="player-form-text">FLEX</b></span>
                </div>
            </div>

            <div class="hud-panel battle-info">
                <h2 class="char-name center-title">Combat Arena</h2>
                <p class="battle-status" id="stage-banner">Press START BATTLE to begin.</p>
                <div class="status-strip">
                    <div class="mini-stat">Round <b id="round-text">1</b></div>
                    <div class="mini-stat" id="turn-label">Player Turn</div>
                </div>
                <button type="button" id="btn-start-battle" class="btn-start-battle">Start Battle</button>
            </div>

            <div class="hud-panel enemy-hud">
                <h2 class="char-name" id="enemy-name">Goblin <span class="level-badge" id="enemy-level-text">Lv.1</span></h2>
                <div class="hp-bar-bg">
                    <div class="hp-bar enemy-hp" id="enemy-hp-bar"></div>
                </div>
                <p class="hp-text" id="enemy-hp-text">80 / 80</p>
                <div class="stats-row">
                    <span>ATK: <b id="enemy-atk">15</b></span>
                    <span>DEF: <b id="enemy-def">10</b></span>
                    <span>MAG: <b id="enemy-mag">5</b></span>
                </div>
            </div>
        </header>

        <main class="battle-stage">
            <div class="sprite-wrap">
                <div class="sprite-canvas char-flex act-idle" id="player-sprite"></div>
                <p class="sprite-label">You</p>
            </div>

            <div class="battle-center">
                <div class="battle-circle"></div>
                <div class="battle-circle inner"></div>
                <div class="battle-line"></div>
                <div class="battle-banner" id="enemy-action-text">-</div>
            </div>

            <div class="sprite-wrap">
                <div class="sprite-canvas enemy-sprite enemy-placeholder act-idle" id="enemy-sprite"></div>
                <p class="sprite-label" id="enemy-banner-name">Goblin</p>
            </div>
        </main>

        <section class="control-container">
            <div class="battle-log">
                <h3>Battle Log</h3>
                <p id="log-text">Wild enemy appeared!</p>
            </div>

            <div class="webcam-box">
                <div class="webcam-title">Pose Camera</div>
                <div id="webcam-container" class="webcam-container">
                    <canvas id="canvas"></canvas>
                    <div id="ai-status" class="ai-status">Loading AI...</div>
                </div>
                <p class="webcam-hint">Idle = Normal</p>
            </div>
        </section>

        <div id="ai-countdown" class="ai-countdown" style="display:none;">3</div>
    </div>

    <div id="level-up-modal" class="level-up-modal" hidden>
        <div class="level-up-card">
            <h2>LEVEL UP!</h2>
            <p>Level: <span id="current-level">1</span></p>
            <p>Points: <span id="stat-points">0</span></p>
            <div class="stat-alloc-buttons">
                <button type="button" onclick="allocateStat('atk')">ATK +1</button>
                <button type="button" onclick="allocateStat('def')">DEF +1</button>
                <button type="button" onclick="allocateStat('mag')">MAG +1</button>
            </div>
            <button type="button" onclick="closeLevelUpModal()" id="btn-close-modal" class="btn-confirm" disabled>
                Confirm
            </button>
        </div>
    </div>

    <script src="Combat_Logic.js"></script>
</body>

</html>
